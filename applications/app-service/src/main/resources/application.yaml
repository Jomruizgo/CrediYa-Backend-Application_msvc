server:
  port: 8080
spring:
  application:
    name: "Application"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: application_db
    schema: public
    username: app_user
    password: app_password

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
  show-actuator: true

logging:
  level:
    root: WARN
    com.crediya: DEBUG
    org.springframework.r2dbc: ERROR
    org.springframework.data.r2dbc: ERROR
    org.springframework: WARN
    io.r2dbc.postgresql: ERROR
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr([%15.15t]){faint} %clr([%X{correlationId:-NO_TRACE}]){magenta} %clr(%logger{36}){blue} - %msg%n%wEx{2}"
