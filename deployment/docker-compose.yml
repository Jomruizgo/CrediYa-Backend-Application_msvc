services:
  postgres-application:
    image: postgres:15-alpine
    container_name: application-postgres
    environment:
      POSTGRES_DB: application_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5434:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
      - ../applications/app-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../applications/app-service/src/main/resources/data-dev.sql:/docker-entrypoint-initdb.d/02-data-dev.sql

volumes:
  app_postgres_data: